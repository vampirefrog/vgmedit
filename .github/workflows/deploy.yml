name: deploy

on:
  push:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # Pinned to match the Emscripten version used locally during development.
      - uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.53
          actions-cache-folder: emsdk-cache

      - run: npm ci

      # Build the WASM module first — vite's import resolver needs the .js
      # at src/wasm/vgmcore.js, which is gitignored.
      - run: npm run build:wasm

      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          # Auto-create the Pages site on first run so the repo doesn't
          # need a one-time UI/CLI step before the workflow can deploy.
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - id: deploy
        uses: actions/deploy-pages@v4
